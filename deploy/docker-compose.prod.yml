# Production stack. Images are built in CI and only pulled here.
# Required in /opt/resget/.env: IMAGE_REPO, POSTGRES_PASSWORD, REDIS_PASSWORD,
# JWT_SECRET, WEB_DOMAIN, API_DOMAIN, ACME_EMAIL (see .env.example).
name: resget

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?WEB_DOMAIN required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL required}
      SITE_ENV: ${SITE_ENV:-production}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web_net]
    depends_on: [api, web]
    deploy:
      resources:
        limits: { memory: 128M, cpus: '0.5' }

  api:
    image: ${API_IMAGE:-${IMAGE_REPO:?IMAGE_REPO required}/api:latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_RELEASE: ${RELEASE_TAG:-dev}
      DATABASE_URL: postgresql://${POSTGRES_USER:-resget}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-resget}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CORS_ORIGIN: https://${WEB_DOMAIN}
      PUBLIC_APP_URL: https://${WEB_DOMAIN}
      PUBLIC_API_URL: https://${API_DOMAIN}
      UPLOADS_DIR: /app/uploads
      # Every optional key of apps/api/src/config/env.ts is listed so a key can
      # never be silently missing; unset ones arrive empty and read as unset.
      SMS_PROVIDER: ${SMS_PROVIDER:-MOCK}
      BILLING_SCHEDULER: ${BILLING_SCHEDULER:-on}
      ORDER_WATCHDOG: ${ORDER_WATCHDOG:-on}
      CAMPAIGN_RUNNER: ${CAMPAIGN_RUNNER:-on}
      CONSENT_REGISTRY_PROVIDER: ${CONSENT_REGISTRY_PROVIDER:-MOCK}
      INVOICE_PROVIDER: ${INVOICE_PROVIDER:-MOCK}
      REFUND_RETRY: ${REFUND_RETRY:-on}
      WEBHOOK_RUNNER: ${WEBHOOK_RUNNER:-on}
      API_KEY_EXPIRY_NOTICES: ${API_KEY_EXPIRY_NOTICES:-on}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-600}
      PUBLIC_ORDER_RATE_LIMIT: ${PUBLIC_ORDER_RATE_LIMIT:-10}
      PUBLIC_FUNNEL_RATE_LIMIT: ${PUBLIC_FUNNEL_RATE_LIMIT:-60}
      PUBLIC_QR_VIEW_RATE_LIMIT: ${PUBLIC_QR_VIEW_RATE_LIMIT:-300}
      PUBLIC_OTP_RATE_LIMIT: ${PUBLIC_OTP_RATE_LIMIT:-30}
      NETGSM_USER: ${NETGSM_USER:-}
      NETGSM_PASSWORD: ${NETGSM_PASSWORD:-}
      NETGSM_HEADER: ${NETGSM_HEADER:-}
      ILETI_MERKEZI_USER: ${ILETI_MERKEZI_USER:-}
      ILETI_MERKEZI_PASSWORD: ${ILETI_MERKEZI_PASSWORD:-}
      ILETI_MERKEZI_SENDER: ${ILETI_MERKEZI_SENDER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-MOCK}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-MOCK}
      SES_REGION: ${SES_REGION:-}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:-}
      SES_SNS_TOPIC_ARNS: ${SES_SNS_TOPIC_ARNS:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY required}
      # Push notifications (docs/MOBIL.md): EXPO with an access token; MOCK refuses every push in production.
      PUSH_PROVIDER: ${PUSH_PROVIDER:-MOCK}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # Address geocoding (docs/VITRIN.md): NONE, NOMINATIM or GOOGLE with a server key.
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      NOMINATIM_BASE_URL: ${NOMINATIM_BASE_URL:-}
      # Custom domains (docs/VITRIN.md): DNS checks the restaurant's record; MOCK is refused in production.
      DOMAIN_VERIFIER: ${DOMAIN_VERIFIER:-}
      # Ad platform conversions and spend (docs/REKLAM.md): LIVE with the Google Ads app credentials.
      ADS_PROVIDER: ${ADS_PROVIDER:-MOCK}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      # IndexNow (docs/SEO.md): LIVE with a key tells search engines about changed pages.
      INDEXNOW_PROVIDER: ${INDEXNOW_PROVIDER:-NONE}
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      # Integration hub (docs/ENTEGRASYON_MERKEZI.md): LIVE with a Meta app connects pages by OAuth.
      META_PROVIDER: ${META_PROVIDER:-NONE}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v21.0}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      # AI studio (docs/YAPAY_ZEKA.md): ANTHROPIC with a key writes drafts; NONE switches drafting off.
      AI_PROVIDER: ${AI_PROVIDER:-NONE}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_DEFAULT_MONTHLY_TOKENS: ${AI_DEFAULT_MONTHLY_TOKENS:-200000}
      CARD_VAULT_PROVIDER: ${CARD_VAULT_PROVIDER:-}
      MASTERPASS_CLIENT_ID: ${MASTERPASS_CLIENT_ID:-}
      MASTERPASS_CLIENT_SECRET: ${MASTERPASS_CLIENT_SECRET:-}
      BEX_MERCHANT_ID: ${BEX_MERCHANT_ID:-}
      BEX_MERCHANT_SECRET: ${BEX_MERCHANT_SECRET:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      IYZICO_API_KEY: ${IYZICO_API_KEY:-}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-}
      PAYTR_MERCHANT_ID: ${PAYTR_MERCHANT_ID:-}
      PAYTR_MERCHANT_KEY: ${PAYTR_MERCHANT_KEY:-}
      PAYTR_MERCHANT_SALT: ${PAYTR_MERCHANT_SALT:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-HAVERSINE}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-}
      COURIER_PROVIDER: ${COURIER_PROVIDER:-MOCK}
      COURIER_API_KEY: ${COURIER_API_KEY:-}
      COURIER_WEBHOOK_SECRET: ${COURIER_WEBHOOK_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      # Uploaded restaurant logos (docs/TASARIM.md); backed up by backup.sh.
      - uploads_data:/app/uploads
    networks: [web_net, internal_net]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        # Node heap is capped at 512 MB in the image; the extra room covers native memory.
        limits: { memory: 768M, cpus: '1.0' }

  web:
    image: ${WEB_IMAGE:-${IMAGE_REPO:?IMAGE_REPO required}/web:latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_API_URL: https://${API_DOMAIN}
      # The BFF proxies to the API over the internal docker network; never baked into client bundles.
      API_INTERNAL_URL: http://api:4000
      # The platform host; any other host reaching the web app is a restaurant's custom domain (docs/VITRIN.md).
      WEB_DOMAIN: ${WEB_DOMAIN}
      APP_RELEASE: ${RELEASE_TAG:-dev}
      # Served at /indexnow/<key>.txt so search engines can verify IndexNow pings (docs/SEO.md).
      INDEXNOW_KEY: ${INDEXNOW_KEY:-}
      # Map tiles (docs/SIPARIS_VE_SEVK.md): empty keeps the OpenStreetMap default; production sets a provider.
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-}
      MAP_MAX_ZOOM: ${MAP_MAX_ZOOM:-}
      # Universal link files for the app (docs/MOBIL.md); empty keeps them unserved.
      IOS_APP_IDENTIFIER: ${IOS_APP_IDENTIFIER:-}
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-}
      ANDROID_CERT_FINGERPRINTS: ${ANDROID_CERT_FINGERPRINTS:-}
    networks: [web_net, internal_net]
    read_only: true
    tmpfs: ['/tmp', '/app/apps/web/.next/cache:uid=1000,gid=1000']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 768M, cpus: '1.0' }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-resget}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal_net]
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=1536MB
      -c max_connections=100
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 1G, cpus: '1.5' }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    command: >
      sh -c 'exec redis-server --requirepass "$$REDISCLI_AUTH"
      --maxmemory 256mb --maxmemory-policy noeviction --save 60 1'
    volumes:
      - redis_data:/data
    networks: [internal_net]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 320M, cpus: '0.5' }

networks:
  web_net:
    driver: bridge
  internal_net:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  uploads_data:
