version: 2
updates:
  # Minor and patch updates are grouped into one PR per week. Majors are
  # planned upgrades tracked in HANDOVER.md, not bot PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Skip versions younger than a week: most malicious publishes are
    # caught and yanked within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # The Expo SDK pins React, React Native and the native modules it
      # bundles (expo/bundledNativeModules.json), and React Native refuses to
      # start when react differs from its bundled renderer, even by a patch.
      # Dependabot applies one version to every manifest of a workspace, so a
      # web React bump also moves the mobile pin. These move by hand: mobile
      # with the Expo SDK upgrade (`npx expo install --fix`), web as a planned
      # upgrade. Advisories still surface through pnpm audit and Dependabot
      # alerts; CI enforces the pins (`deps:check`).
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker
    directories: [/deploy/docker]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build(docker)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
