version: 2
updates:
  # Minor and patch updates are grouped into one PR per week. Majors are
  # planned upgrades tracked in HANDOVER.md, not bot PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Skip versions younger than a week: most malicious publishes are
    # caught and yanked within days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # The Expo SDK pins React, React Native and the native modules it
      # bundles (expo/bundledNativeModules.json); a minor bump past that pin
      # breaks the mobile build. They move with the Expo SDK upgrade instead.
      # React is shared with web, so its minors are planned upgrades too.
      - dependency-name: 'react'
        update-types: [version-update:semver-minor]
      - dependency-name: 'react-dom'
        update-types: [version-update:semver-minor]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-minor]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-minor]
      - dependency-name: 'react-native'
        update-types: [version-update:semver-minor]
      - dependency-name: 'react-native-*'
        update-types: [version-update:semver-minor]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker
    directories: [/deploy/docker]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build(docker)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci(deps)
