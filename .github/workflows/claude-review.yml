name: Claude PR review

# Cost tiers: small diffs are reviewed by Haiku, everything else by Sonnet.
# Opus is never used automatically; ask for it with "@claude /opus ..." in a
# comment (see claude.yml). Inert until the repository variable
# CLAUDE_AGENTS_ENABLED is "true" and an Anthropic credential secret exists.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      vars.CLAUDE_AGENTS_ENABLED == 'true' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Pick model by diff size
        id: tier
        env:
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
          FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          CHANGED=$((ADDITIONS + DELETIONS))
          if [ "$CHANGED" -le 80 ] && [ "$FILES" -le 5 ]; then
            echo "model=claude-haiku-4-5-20251001" >> "$GITHUB_OUTPUT"; echo "turns=12" >> "$GITHUB_OUTPUT"
          else
            echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"; echo "turns=25" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }}.
            Read CLAUDE.md first; its rules are the review baseline.

            Report only real problems, most severe first:
            - tenant isolation: queries on tenant data without a restaurantId
              filter, endpoints without @RestaurantScoped() and @RequirePermission()
            - money: float arithmetic, amounts without a currency, settlement
              order changed, withholding or PSP fee treated as platform revenue,
              courier fee folded into the commission
            - security: injection, secrets in code, missing input validation,
              unsafe GitHub Actions expressions
            - correctness bugs and missing tests for changed logic
            - CLAUDE.md violations (emoji, duplicated shared types, hardcoded
              text instead of i18n keys, hardcoded currency or country)
            Skip style nits a formatter would catch. Put each finding as an
            inline comment on the exact line, then one short summary comment.
            If there is nothing worth reporting, say so in one sentence.
          claude_args: >-
            --model ${{ steps.tier.outputs.model }}
            --max-turns ${{ steps.tier.outputs.turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
