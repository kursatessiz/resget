name: CI

on:
  # Working branches run CI through their pull request only; main runs CI
  # through release.yml (workflow_call). A push trigger on top would run
  # every job twice.
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Placeholder so Prisma can validate and generate; no database is contacted.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public # trufflehog:ignore (throwaway CI service credentials)
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @resget/database exec prisma validate

      - name: Formatting (prettier)
        run: pnpm exec prettier --check "apps/**/*.{ts,tsx,css}" "packages/**/*.ts" "*.json" ".github/**/*.yml" "deploy/**/*.yml"

      - name: Build
        run: pnpm turbo run build

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Unit tests
        run: pnpm turbo run test

      - name: Dependency audit (high and critical)
        run: pnpm audit --audit-level high

  migrations:
    name: Migrations apply on a fresh database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_migrate?schema=public # trufflehog:ignore (throwaway CI service credentials)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: Build shared and database packages
        run: pnpm turbo run build --filter=@resget/database...

      - name: Apply migrations
        run: pnpm --filter @resget/database exec prisma migrate deploy

      - name: Schema and migrations agree (no drift)
        run: pnpm --filter @resget/database exec prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code

      - name: Seed database
        run: pnpm --filter @resget/database db:seed

  e2e:
    name: API e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e?schema=public # trufflehog:ignore (throwaway CI service credentials)
      # Throwaway value used only for this job's ephemeral Postgres container.
      JWT_SECRET: ci-e2e-throwaway-secret-0123456789abcdef
      OTP_TEST_CODE: '482915'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@resget/api...

      - name: Apply migrations
        run: pnpm --filter @resget/database exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @resget/database db:seed

      - name: Run e2e tests
        run: pnpm --filter @resget/api test:e2e

  web-e2e:
    name: Web browser e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_web_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_web_e2e?schema=public # trufflehog:ignore (throwaway CI service credentials)
      # Throwaway value used only for this job's ephemeral Postgres container.
      JWT_SECRET: ci-e2e-throwaway-secret-0123456789abcdef
      OTP_TEST_CODE: '482915'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: Build (API and its dependencies; the web app builds itself in the Playwright webServer)
        run: pnpm turbo run build --filter=@resget/api...

      - name: Apply migrations
        run: pnpm --filter @resget/database exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @resget/database db:seed

      - name: Install Playwright Chromium
        run: pnpm --filter @resget/web exec playwright install --with-deps chromium

      - name: Run web e2e tests
        run: pnpm --filter @resget/web test:e2e

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  scripts:
    name: Scripts and workflows lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x deploy/scripts/*.sh
      - name: actionlint
        env:
          VERSION: 1.7.7
          SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -fsSL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -shellcheck="$(command -v shellcheck)"

  images:
    name: Docker images build
    # Pushes to main build and publish in release.yml; this only proves the
    # Dockerfiles still build on pull requests.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/${{ matrix.app }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
