name: Claude assistant

# "@claude <request>" in an issue or PR comment from someone with write
# access. Default model is Sonnet. Put "/opus" in the comment for hard,
# multi-file work, or "/haiku" for quick questions.
# Inert until CLAUDE_AGENTS_ENABLED is "true" and a credential secret exists.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    if: >-
      vars.CLAUDE_AGENTS_ENABLED == 'true' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Pick model from request
        id: tier
        env:
          BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body }}
        run: |
          case "$BODY" in
            */opus*)  echo "model=claude-opus-5-5" >> "$GITHUB_OUTPUT";          echo "turns=80" >> "$GITHUB_OUTPUT" ;;
            */haiku*) echo "model=claude-haiku-4-5-20251001" >> "$GITHUB_OUTPUT"; echo "turns=15" >> "$GITHUB_OUTPUT" ;;
            *)        echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT";          echo "turns=50" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          additional_permissions: |
            actions: read
          claude_args: >-
            --model ${{ steps.tier.outputs.model }}
            --max-turns ${{ steps.tier.outputs.turns }}
            --allowedTools "Bash(pnpm install:*),Bash(pnpm turbo run:*),Bash(pnpm --filter:*),Bash(pnpm audit:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh run view:*),Edit,Write,Read,Grep,Glob"
