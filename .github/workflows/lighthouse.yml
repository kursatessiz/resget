name: Lighthouse

# Performance, SEO, accessibility and best-practices budget of the public
# pages: the landing page and a table QR menu page (docs/CICD_GUIDE.md).
# SEO and accessibility fail the job; performance and best-practices only warn.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lighthouse:
    name: Lighthouse CI (public pages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_lighthouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_lighthouse?schema=public # trufflehog:ignore (throwaway CI service credentials)
      # Throwaway value used only for this job's ephemeral Postgres container.
      JWT_SECRET: ci-lighthouse-throwaway-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: Build (API and web with their dependencies)
        run: pnpm turbo run build --filter=@resget/api... --filter=@resget/web...

      - name: Apply migrations
        run: pnpm --filter @resget/database exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @resget/database db:seed

      - name: Start API and web
        env:
          NODE_ENV: test
          OTP_TEST_CODE: '482915'
          PUBLIC_APP_URL: http://localhost:3000
          PUBLIC_API_URL: http://localhost:4000
          CORS_ORIGIN: http://localhost:3000
        run: |
          (cd apps/api && PORT=4000 nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &)
          (cd apps/web && API_INTERNAL_URL=http://localhost:4000 nohup pnpm exec next start -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &)
          for url in http://localhost:4000/health http://localhost:3000/; do
            for _ in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then break; fi
              sleep 2
            done
            curl -fsS -o /dev/null "$url"
          done

      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: apps/web/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Server logs
        if: failure()
        run: |
          tail -n 60 "$RUNNER_TEMP/api.log" || true
          tail -n 60 "$RUNNER_TEMP/web.log" || true
